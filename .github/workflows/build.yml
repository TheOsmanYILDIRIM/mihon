name: Build & Test
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main
      - selective-white-arm64
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run checks, unit tests and database migration checks
        id: unit_tests
        run: ./gradlew check spotlessCheck testDebugUnitTest verifySqlDelightMigration -Pdist=local --build-cache

      - name: Prepare persistent signing identity
        id: signing
        if: github.event_name != 'pull_request'
        env:
          MIHON_SIGNING_SEED: ${{ secrets.MIHON_SIGNING_SEED }}
        run: |
          if [ -z "$MIHON_SIGNING_SEED" ]; then
            echo "::warning::Signing seed missing; this run will validate compilation but will not publish an installable APK."
            exit 0
          fi
          python3 -m pip install --break-system-packages cryptography==45.0.7
          python3 .github/scripts/personal_signing.py --self-test
          python3 .github/scripts/personal_signing.py "$RUNNER_TEMP/mihon-personal.p12"

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build app
        env:
          MIHON_GITHUB_RELEASE: ${{ steps.signing.outputs.ready }}
          storeFile: ${{ runner.temp }}/mihon-personal.p12
          storePassword: ${{ secrets.MIHON_SIGNING_SEED }}
          keyAlias: mihon
          keyPassword: ${{ secrets.MIHON_SIGNING_SEED }}
        run: ./gradlew :app:assembleRelease -Pdist=local -Ppersonal-version-code="$((1000 + GITHUB_RUN_NUMBER))" --build-cache

      - name: Verify release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          EXPECTED_SIGNER: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -o pipefail
          apk=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-cert.txt"
          test "$(awk -F ': ' '/^(Signer #1|V[0-9.]+ Signer):? certificate SHA-256 digest: / {print $2}' "$RUNNER_TEMP/apk-cert.txt" | sort -u)" = "$EXPECTED_SIGNER"
          test "$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ {print $2}' | sort -u)" = arm64-v8a
          test -f app/build/outputs/mapping/release/mapping.txt

      - name: Delete signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mihon-personal.p12"

      - name: Upload APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
